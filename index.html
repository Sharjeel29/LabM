    <script>
        function validateForm() {
            let valid = true;
    
    document.getElementById('usernameError').innerText = '';
    document.getElementById('emailError').innerText = '';
    document.getElementById('passwordError').innerText = '';
    document.getElementById('confirmPasswordError').innerText = '';
    document.getElementById('dobError').innerText = '';
    document.getElementById('countryError').innerText = '';
    document.getElementById('genderError').innerText = '';
    document.getElementById('termsError').innerText = '';

            let username = document.getElementById('username');
            let usernamePattern = /^[a-zA-Z\-\s]+$/;
            if (!usernamePattern.test(username.value.trim())) {
                document.getElementById('usernameError').innerText = "Only letters, space, and dash allowed.";

                valid = false;
            }
    
            let email = document.getElementById('email');
            let emailPattern = /^[a-zA-Z0-9._%+-]+@(gmail|yahoo|hotmail)\.com$/;
            if (!emailPattern.test(email.value.trim())) {
                document.getElementById('emailError').innerText = "Invalid Email! Only Gmail, Yahoo, Hotmail allowed.";
                valid = false;
            }
    
            let password = document.getElementById('password').value;
            let confirmPassword = document.getElementById('confirm_password').value;
            let passwordPattern = /^[a-zA-Z0-9]{8,}$/;
            if (!passwordPattern.test(password)) {
                document.getElementById('passwordError').innerText = "Password must be alphanumeric and 8+ characters.";
                valid = false;
            } else if (password !== confirmPassword) {
                document.getElementById('confirmPasswordError').innerText = "Passwords do not match.";

                valid = false;
            }
    
            let dob = document.getElementById('dob').value;
            if (dob) {
                let birthDate = new Date(dob);  
                let today = new Date();
                let age = today.getFullYear() - birthDate.getFullYear();
                let m = today.getMonth() - birthDate.getMonth();
                if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
                    age--;
                }
                if (age < 18) {
                    document.getElementById('dobError').innerText = "You must be at least 18 years old.";
                    valid = false;
                }
            } else {
                document.getElementById('dobError').innerText = "Please select your Date of Birth.";

                valid = false;
            }
    
            let country = document.getElementById('country').value;
            if (country === '') {
                document.getElementById('countryError').innerText = "Please select a country.";
                valid = false;
            }


            let gender = document.querySelector('input[name="gender"]:checked');
        if (!gender) {
            document.getElementById('genderError').innerText = "Please select your gender.";
            valid = false;
        }


            let termsCheckbox = document.getElementById('newsletter');
        if (!termsCheckbox.checked) {
            document.getElementById('termsError').innerText = "You must agree to the Terms and Conditions.";
            valid = false;
        }
    
            if (valid) {
                alert('Registration done');
                document.getElementById('registrationForm').reset();

            }
    
            return valid;
        }
    </script>
